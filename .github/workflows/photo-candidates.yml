name: Photo candidates (review only)
on:
  push:
    branches: [photo-candidates]
    paths: [tools/fetch_originals.py, .github/workflows/photo-candidates.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fetch_originals.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add photo-candidates
          git commit -m "Photo candidates for review" || echo nothing
          git push
