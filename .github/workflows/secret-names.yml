name: Check which affiliate secrets exist (names only)
on: workflow_dispatch
jobs:
  names:
    runs-on: ubuntu-latest
    steps:
      - env:
          A1: ${{ secrets.PARTNERIZE_API_KEY }}
          A2: ${{ secrets.PARTNERIZE_APPLICATION_KEY }}
          A3: ${{ secrets.PARTNERIZE_APP_KEY }}
          A4: ${{ secrets.PARTNERIZE_USER_API_KEY }}
          A5: ${{ secrets.PARTNERIZE_PUBLISHER_ID }}
          A6: ${{ secrets.PARTNERIZE_CAMREF }}
          A7: ${{ secrets.MARRIOTT_CAMREF }}
          A8: ${{ secrets.MARRIOTT_PARTNERIZE_CAMREF }}
          A9: ${{ secrets.PARTNERIZE_KEY }}
          A10: ${{ secrets.MARRIOTT_AFFILIATE_ID }}
          A11: ${{ secrets.PARTNERIZE_TOKEN }}
          A12: ${{ secrets.MARRIOTT_API_KEY }}
          A13: ${{ secrets.PARTNERIZE_USER_APPLICATION_KEY }}
          A14: ${{ secrets.MARRIOTT_PARTNERIZE }}
          A15: ${{ secrets.PARTNERIZE }}
          A16: ${{ secrets.MARRIOTT }}
          A17: ${{ secrets.PARTNERIZE_PUBLISHER_KEY }}
          A18: ${{ secrets.PARTNERIZE_USER_KEY }}
          A19: ${{ secrets.MARRIOTT_AFFILIATE_LINK }}
          A20: ${{ secrets.MARRIOTT_LINK }}
        run: |
          n=(PARTNERIZE_API_KEY PARTNERIZE_APPLICATION_KEY PARTNERIZE_APP_KEY PARTNERIZE_USER_API_KEY PARTNERIZE_PUBLISHER_ID PARTNERIZE_CAMREF MARRIOTT_CAMREF MARRIOTT_PARTNERIZE_CAMREF PARTNERIZE_KEY MARRIOTT_AFFILIATE_ID PARTNERIZE_TOKEN MARRIOTT_API_KEY PARTNERIZE_USER_APPLICATION_KEY MARRIOTT_PARTNERIZE PARTNERIZE MARRIOTT PARTNERIZE_PUBLISHER_KEY PARTNERIZE_USER_KEY MARRIOTT_AFFILIATE_LINK MARRIOTT_LINK)
          for i in $(seq 1 20); do v="A$i"; [ -n "${!v}" ] && echo "FOUND ${n[$((i-1))]} (length ${#v}${!v:+ set})"; done; echo done
