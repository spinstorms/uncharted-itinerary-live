name: Publish StayOdds Bundle to stayodds.com (spinstorms/stayodds-live)

on:
  push:
    branches:
      - main
    paths:
      - "stayodds-src/**"
      - "assets/**"
      - "data/stayodds-*.json"
      - "data/price-snapshots.json"
      - "scripts/build_stayodds_domain.py"
      - "scripts/build_stayodds_site.py"
      - "scripts/audit_brands_and_loyalty.py"
      - "scripts/stayodds_chrome.py"
  workflow_dispatch:

concurrency:
  group: "publish-stayodds-domain"
  cancel-in-progress: false

jobs:
  publish-stayodds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout uncharted-itinerary-live
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build stayodds.com standalone bundle
        run: python3 scripts/build_stayodds_domain.py

      - name: Sync bundle to spinstorms/stayodds-live via SSH Deploy Key
        env:
          DEPLOY_KEY: ${{ secrets.STAYODDS_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/stayodds_deploy
          chmod 600 ~/.ssh/stayodds_deploy
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/stayodds_deploy -o IdentitiesOnly=yes"
          git clone --depth 1 git@github.com:spinstorms/stayodds-live.git /tmp/stayodds-live
          rsync -a --delete --exclude='.git' .stayodds-dist/ /tmp/stayodds-live/
          cd /tmp/stayodds-live
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync stayodds.com bundle from uncharted-itinerary-live@${GITHUB_SHA::8}"
            git push origin main
          else
            echo "No changes to publish to spinstorms/stayodds-live (already up to date)."
          fi
