name: Probe hotel photo candidates (read-only)

on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Property ids, space separated"
        required: true

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Save candidates to the probe-photos branch
        env:
          NUITEE_API_KEY: ${{ secrets.NUITEE_API_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ inputs.ids }}" == *--commons* ]]; then python3 scripts/commons_photos.py /tmp/out $(echo "${{ inputs.ids }}" | sed 's/--commons//'); elif [[ "${{ inputs.ids }}" == *--official* ]]; then python3 scripts/official_photos.py /tmp/out $(echo "${{ inputs.ids }}" | sed 's/--official//'); else python3 scripts/photo_candidates.py /tmp/out ${{ inputs.ids }}; fi
          cd /tmp/out && git init -q && git checkout -q -b probe-photos
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add . && git commit -qm "photo candidates"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" probe-photos
