name: Fetch hotel photo galleries (LiteAPI)

on:
  workflow_dispatch:
    inputs:
      refresh:
        description: "Re-fetch every hotel (otherwise only hotels without a gallery)"
        type: boolean
        default: false
      search:
        description: "Only look up LiteAPI candidates: 'Name|CC;Name|CC'"
        default: ""
  push:
    branches: [main]
    paths: [scripts/fetch_gallery.py, .github/workflows/fetch-gallery.yml, data/gallery-manual.json]

permissions:
  contents: write
  actions: write

concurrency:
  group: fetch-gallery
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Fetch galleries
        env:
          NUITEE_API_KEY: ${{ secrets.NUITEE_API_KEY }}
          GALLERY_SEARCH: ${{ inputs.search }}
        run: python3 scripts/fetch_gallery.py ${{ inputs.refresh && '--refresh' || '' }}
      - name: Save official photos (data/gallery-manual.json)
        if: ${{ !inputs.search }}
        run: pip install -q pillow && python3 scripts/fetch_official_photos.py
      - name: Commit
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hotel-gallery.json assets/card-photos
          if ! git diff --cached --quiet; then
            git commit -m "chore: hotel photo galleries"
            git pull --rebase -X ours origin main
            git push origin main
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish stayodds.com
        if: steps.commit.outputs.pushed == 'true'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh workflow run publish-stayodds.yml --ref main
