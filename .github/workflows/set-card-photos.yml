name: Set hand-picked hotel card photos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["data/card-photo-overrides.json"]

permissions:
  contents: write
  actions: write

concurrency:
  group: card-photos
  cancel-in-progress: false

jobs:
  photos:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Download and save the chosen photos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python3 scripts/set_card_photos.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/card-photos
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Hand-picked overview photos for hotel cards"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin main && break; sleep $((i*10)); done
      - name: Publish stayodds.com
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-stayodds.yml --ref main || true
