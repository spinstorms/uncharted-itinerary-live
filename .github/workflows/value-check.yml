name: Value check (careful prices for the best-value insight)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - run: python3 -u scripts/value_check.py
        env:
          NUITEE_API_KEY: ${{ secrets.NUITEE_API_KEY }}
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/value-check.json
          git diff --cached --quiet || { git commit -m "Value check prices"; git pull --rebase -X ours; git push; }
