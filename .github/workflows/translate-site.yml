name: Translate stayodds.com (all languages)

# Run by hand. Uses the Gemini key (paid per use): only text not yet in data/i18n-cache is sent.
# Each language runs as its own job, side by side.
on:
  workflow_dispatch:
    inputs:
      langs:
        description: "Languages as a JSON list (blank = all 11)"
        default: ""

permissions:
  contents: write
  actions: write

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 11
      matrix:
        lang: ${{ fromJSON(inputs.langs != '' && inputs.langs || '["es","pt-BR","fr","de","it","ar","ja","id","fa","zh-Hans","ko"]') }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build the site
        run: python3 scripts/build_stayodds_domain.py
      - name: Translate new text (${{ matrix.lang }})
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TRANSLATE_BUDGET_SECONDS: "19000"
          TRANSLATE_THREADS: "16"
        run: python3 scripts/translate_site.py --translate .stayodds-dist ${{ matrix.lang }}
      - name: Save translations
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/i18n-cache/${{ matrix.lang }}.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: site translations (${{ matrix.lang }})"
            for i in 1 2 3 4 5; do
              git pull --rebase -X ours origin main && git push origin main && break
              sleep $((RANDOM % 20 + 5))
            done
          fi
