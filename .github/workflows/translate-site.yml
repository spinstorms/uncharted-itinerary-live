name: Translate stayodds.com (all languages)

# Approved by Oliver (28 Nov 2026): runs once a day until every language is done. The Gemini key is on the
# free tier, so each run stops at the daily quota and the next day carries on. Only text not yet in
# data/i18n-cache is sent; once everything is translated a run sends nothing.
# Runs at 09:23 UTC, after the free-tier daily quota resets (midnight Pacific).
on:
  schedule:
    - cron: "23 9 * * *"
  workflow_dispatch:
    inputs:
      langs:
        description: "Languages as a JSON list (blank = all 11)"
        default: ""

permissions:
  contents: write
  actions: write

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        lang: ${{ fromJSON(inputs.langs || '["es","pt-BR","fr","de","it","ar","ja","id","fa","zh-Hans","ko"]') }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build the site
        run: python3 scripts/build_stayodds_domain.py
      - name: Translate new text (${{ matrix.lang }})
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TRANSLATE_BUDGET_SECONDS: "19000"
          TRANSLATE_THREADS: "4"
        run: python3 scripts/translate_site.py --translate .stayodds-dist ${{ matrix.lang }}
      - name: Save translations
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/i18n-cache/${{ matrix.lang }}.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: site translations (${{ matrix.lang }})"
            for i in 1 2 3 4 5; do
              git pull --rebase -X ours origin main && git push origin main && break
              sleep $((RANDOM % 20 + 5))
            done
          fi

  # Commits made by this workflow do not trigger other workflows, so ask for a
  # stayodds.com publish once the languages are done (free: build and copy only).
  # Approved by Oliver, 28 Nov 2026.
  publish:
    needs: translate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: gh workflow run publish-stayodds.yml -R "${{ github.repository }}" --ref main
        env:
          GH_TOKEN: ${{ github.token }}
