<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>StayOdds Compare — Moved to StayOdds.com</title>
  <meta name="robots" content="noindex, follow" />
  <link rel="canonical" href="https://stayodds.com/" />
  <script>
    (function () {
      var target = "https://stayodds.com/" + (window.location.search || "") + (window.location.hash || "");
      try {
        var raw = localStorage.getItem("stayodds_shortlist_v1");
        if (raw) {
          var arr = JSON.parse(raw);
          if (Array.isArray(arr) && arr.length) {
            var u = new URL(target);
            if (!u.searchParams.has("import_saved")) {
              u.searchParams.set("import_saved", arr.slice(0, 60).join(","));
            }
            target = u.toString();
          }
        }
      } catch (_) {}
      window.location.replace(target);
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="0;url=https://stayodds.com/" /></noscript>
</head>
<body>
  <p>StayOdds has moved to <a href="https://stayodds.com/">https://stayodds.com/</a>…</p>
</body>
</html>
